name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

env:
  REGISTRY: registry.cloud.ru
  IMAGE_NAME: api-application

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: apiApplication
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: apiApplication
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run webapp:prod --if-present

      - name: Build and test with Maven
        run: ./mvnw clean verify -Pprod -DskipTests=false
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/apiApplication
          SPRING_DATASOURCE_USERNAME: apiApplication
          SPRING_DATASOURCE_PASSWORD: testpassword
          SPRING_PROFILES_ACTIVE: test

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: target/test-results/

  build-and-push:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Cloud.ru Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.CLOUD_REGISTRY_USERNAME }}
          password: ${{ secrets.CLOUD_REGISTRY_PASSWORD }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=ref,event=branch
            type=semver,pattern={{version}}
            latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache,mode=max
          build-args: |
            SPRING_PROFILES_ACTIVE=prod

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Cloud.ru
        env:
          CLOUD_API_KEY: ${{ secrets.CLOUD_API_KEY }}
          CLOUD_FOLDER_ID: ${{ secrets.CLOUD_FOLDER_ID }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          JHIPSTER_SECURITY_KEY: ${{ secrets.JHIPSTER_SECURITY_KEY }}
        run: |
          echo "Deploying to Cloud.ru..."
          echo "Image: registry.cloud.ru/api-application:${{ github.sha }}"
          echo "Domain: http://public-api.ru"
          
          # Здесь можно добавить скрипт для деплоя в Cloud.ru
          # Например, через yandex-cloud CLI или Terraform
          
          # Пример обновления deployment в Managed Kubernetes:
          # kubectl set image deployment/api-application api-application=registry.cloud.ru/api-application:${{ github.sha }}
          
          # Или через Cloud Run:
          # gcloud run deploy api-application --image registry.cloud.ru/api-application:${{ github.sha }} --platform managed --region ru-central1
          
          echo "Deployment completed!"

      - name: Health check
        run: |
          echo "Waiting for application to be ready..."
          sleep 30
          curl -f http://public-api.ru/management/health || exit 1
          echo "Application is healthy!"
